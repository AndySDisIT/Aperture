publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  google_maps_flutter: ^2.6.1
  http: ^1.2.2
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
